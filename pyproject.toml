[project]
name = "reins"
version = "0.1.0"
description = "Event-sourced agent control kernel"
requires-python = ">=3.11"
authors = [
    { name = "Reins Contributors" },
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["agent", "orchestration", "event-sourcing", "ai", "coding-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "aiohttp>=3.9",
    "structlog>=24.0",
    "ulid-py>=1.1",
    "PyYAML>=6.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/reins-dev/reins"
Repository = "https://github.com/reins-dev/reins"
Issues = "https://github.com/reins-dev/reins/issues"

[project.scripts]
reins = "reins.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["src/reins"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.coverage.json]
output = "coverage.json"
