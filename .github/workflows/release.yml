name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
      - name: Generate changelog
        run: |
          pip install -e .
          python -c "
          from reins.packaging.changelog import ChangelogGenerator
          from pathlib import Path
          gen = ChangelogGenerator(Path('.'))
          commits = gen.parse_commits()
          if commits:
              import os
              tag = os.environ.get('GITHUB_REF_NAME', 'unknown')
              entry = gen.generate_entry(tag.lstrip('v'), commits)
              print(gen.render_markdown(entry))
          "
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
